name: Daily Task Reminder

on:
  schedule:
    # 23:00 UTC вс-чт = 09:00 Владивосток пн-пт
    - cron: '0 23 * * 0,1,2,3,4'
    # 04:00 UTC пн-пт = 14:00 Владивосток пн-пт
    - cron: '0 4 * * 1,2,3,4,5'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram reminder
        run: |
          curl -s -X POST "${{ secrets.VERCEL_SITE_URL }}/api/remind" \
            -H "x-reminder-secret: ${{ secrets.REMINDER_SECRET }}"
          echo "Reminder triggered at $(date)"
